version: '3.8'

services:
  client-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-lead-hunter-pro
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - lead_data:/app/backend
    environment:
      - PORT=8000
    env_file:
      - backend/.env

volumes:
  lead_data:

