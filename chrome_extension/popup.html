<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YT Lead Hunter PRO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #8b1524;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
    }
    .title h3 {
      font-size: 15px;
      font-weight: 800;
    }
    .title span {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .quota-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .quota-box strong {
      color: #10b981;
      font-size: 14px;
    }
    .btn-open {
      width: 100%;
      background: #8b1524;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
      box-shadow: 0 4px 12px rgba(139, 21, 36, 0.4);
    }
    .btn-open:hover {
      background: #73101c;
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">▶</div>
    <div class="title">
      <h3>YT Lead Hunter PRO</h3>
      <span>Extension Edition</span>
    </div>
  </div>

  <div class="quota-box">
    <span style="font-size:12px;color:#94a3b8;">Daily Magic Quota:</span>
    <strong>● 30,000 units</strong>
  </div>

  <button class="btn-open" id="openAppBtn">
    🚀 Open Full Dashboard
  </button>

  <div class="footer">
    Client Hunting &amp; AI Outreach Engine
  </div>

  <script src="popup.js"></script>
</body>
</html>
